 for (let i = 1; i <= 100; i++) {

 let arr3 = arr.map((num) => { return num + 3;

button5.addEventListener("click", ()=>{


 function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
          let j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
    
return arr
    }

});
